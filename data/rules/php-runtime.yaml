  category: php-security
  dry-run-support: full
  condition: |
    components[
      type = 'file'
      and $hasProp($, 'cdx:php:buildVersion')
      and $hasProp($, 'cdx:php:sapi')
      and (
        $m := $match($prop($, 'cdx:php:buildVersion'), /^(\d+)\.(\d+)\.(\d+)(?:-(dev)|(alpha|beta|RC)(\d+))?$/);
        $m != null
        and (
          $number($m.groups[0]) < 8
          or ($number($m.groups[0]) = 8 and $number($m.groups[1]) < 2)
          or (
            $number($m.groups[0]) = 8
            and $number($m.groups[1]) = 2
            and $number($m.groups[2]) < 35
          )
          or (
            $number($m.groups[0]) = 8
            and $number($m.groups[1]) = 3
            and $number($m.groups[2]) < 36
          )
          or (
            $number($m.groups[0]) = 8
            and $number($m.groups[1]) = 4
            and $number($m.groups[2]) < 27
          )
          or (
            $number($m.groups[0]) = 8
            and $number($m.groups[1]) = 5
            and $number($m.groups[2]) < 12
          )
          or (
            $number($m.groups[0]) = 8
